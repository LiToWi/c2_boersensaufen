services:
  app:
    build:
      context: .
    ports:
      - "2007:3000" # Next production port
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      # Point the app container to the PHP microservice by docker-compose service name
      - READY2ORDER_PHP_URL=http://php-ready2order:8090/products
      # External Convex URL for client-side access via proxy (uses existing convex.campus-cneipe.de subdomain)
      - NEXT_PUBLIC_CONVEX_URL=https://convex.campus-cneipe.de
      # Internal backend URL for server-side calls
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
    networks:
      - default
      - nginx-proxy-manager
    restart: unless-stopped
  php-ready2order:
    image: composer:2
    working_dir: /srv
    volumes:
      - ./ready2order-service:/srv
    environment:
      READY2ORDER_ACCOUNT_TOKEN: ${READY2ORDER_ACCOUNT_TOKEN}
    # Use Composer image so composer is available. Install deps then start PHP built-in server
    command: bash -lc "composer install --no-interaction --no-ansi && php -S 0.0.0.0:8090 -t public public/router.php"
    ports:
      - "8090:8090"
  backend:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    env_file:
      - .env.local
    environment:
      - ACTIONS_USER_TIMEOUT_SECS
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DATABASE_URL
      - DISABLE_BEACON
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800} # Lower default document retention to 2 days
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - MYSQL_URL
      - POSTGRES_URL
      - READY2ORDER_ACCOUNT_TOKEN
      - REDACT_LOGS_TO_CLIENT
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET

    healthcheck:
      test: curl -f http://127.0.0.1:3210/version
      interval: 5s
      start_period: 10s
    networks:
      - default
      - nginx-proxy-manager

  dashboard:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:

networks:
  default:
    name: c2_boersensaufen_default
  nginx-proxy-manager:
    external: true
    name: nginx-proxy-manager_default
